worker_processes auto;

error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # The query string is not logged: the OIDC callback carries the code and state in it.
    map $request_uri $request_path {
        "~^(?<path>[^?]*)" $path;
    }

    log_format main '$remote_addr - [$time_local] "$request_method $request_path $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        absolute_redirect off;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # An add_header in a location drops the inherited ones: each location includes the headers itself.
        location = /.env.js {
            alias /tmp/nginx/env.js;
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
            include /tmp/nginx/security-headers.conf;
        }

        location /static/ {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /tmp/nginx/security-headers.conf;
        }

        include /tmp/nginx/api.conf;

        # The overlay TwakeSpace puts over its page: a file, not the app
        location = /embed/overlay.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            include /tmp/nginx/embed-headers.conf;
        }

        location ~ ^/(embed/|auth/callback$) {
            try_files /index.html =404;
            add_header Cache-Control "no-cache" always;
            include /tmp/nginx/embed-headers.conf;
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            include /tmp/nginx/security-headers.conf;
        }
    }
}
