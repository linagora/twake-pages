name: Check

on:
  workflow_call:
    inputs:
      project:
        description: Directory under apps/, e.g. "backend"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit
      - run: npm run check --workspace "@twake-pages/${{ inputs.project }}"
