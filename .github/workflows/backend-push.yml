name: Backend Push

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".dockerignore"
      - ".github/workflows/backend-*.yml"
      - ".github/workflows/reusable-*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/reusable-check.yml
    with:
      project: backend

  publish:
    needs: [check]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      project: backend
      push: true
