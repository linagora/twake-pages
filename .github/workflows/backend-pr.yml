name: Backend PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.nvmrc'
      - '.dockerignore'
      - '.github/workflows/backend-*.yml'
      - '.github/workflows/reusable-*.yml'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/reusable-check.yml
    with:
      project: backend

  image:
    uses: ./.github/workflows/reusable-image.yml
    with:
      project: backend
