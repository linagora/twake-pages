name: Image

on:
  workflow_call:
    inputs:
      project:
        description: Directory under apps/, e.g. "backend"
        required: true
        type: string
      push:
        description: Push to GHCR; otherwise build (and smoke test) only. The caller grants packages write.
        required: false
        type: boolean
        default: false
      version:
        description: Release version, pushed next to latest
        required: false
        type: string
        default: ""

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERFILE: apps/${{ inputs.project }}/Dockerfile
      SMOKE_TEST: apps/${{ inputs.project }}/docker/smoke-test.sh
      LOCAL_IMAGE: twake-pages-${{ inputs.project }}:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          cache-from: type=gha,scope=${{ inputs.project }}
          cache-to: type=gha,mode=max,scope=${{ inputs.project }}

      - name: Smoke test
        run: |
          if [[ -x "$SMOKE_TEST" ]]; then
            "$SMOKE_TEST" "$LOCAL_IMAGE"
          else
            echo "No smoke test for ${{ inputs.project }}"
          fi

      - name: Tags and labels
        if: inputs.push
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/twake-pages-${{ inputs.project }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: inputs.push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.project }}
