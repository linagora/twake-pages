name: End to end

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'e2e/**'
      - 'docker-compose.yml'
      - 'postgres-init.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check --workspace @twake-pages/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: ./e2e/stack.sh up
      - run: npm test --workspace @twake-pages/e2e
      - if: failure()
        run: mkdir -p e2e/playwright-report && docker compose -p twake-pages-e2e -f docker-compose.yml -f e2e/docker-compose.e2e.yml logs --no-color > e2e/playwright-report/stack.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
